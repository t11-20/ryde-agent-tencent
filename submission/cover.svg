<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="cover-title">
  <title id="cover-title">FairTrip — Ryde Multi-Agent Autonomous Dispute Resolution System</title>
  <rect width="1920" height="1080" fill="#F6F8FA"/>

  <!-- Transit-line motif: one line per actor (rider blue, driver green, Judge purple) -->
  <g fill="none" stroke-linecap="round">
    <path d="M160 640 H1760" stroke="#005EC4" stroke-width="16"/>
    <path d="M160 750 H1760" stroke="#009645" stroke-width="16"/>
    <path d="M160 860 H1760" stroke="#9900AA" stroke-width="16"/>
    <path d="M1120 640 V860" stroke="#5B6770" stroke-width="10"/>
  </g>
  <g fill="#F6F8FA" stroke-width="8">
    <circle cx="400" cy="640" r="13" stroke="#005EC4"/>
    <circle cx="800" cy="640" r="13" stroke="#005EC4"/>
    <circle cx="1440" cy="640" r="13" stroke="#005EC4"/>
    <circle cx="560" cy="750" r="13" stroke="#009645"/>
    <circle cx="1400" cy="750" r="13" stroke="#009645"/>
    <circle cx="480" cy="860" r="13" stroke="#9900AA"/>
    <circle cx="880" cy="860" r="13" stroke="#9900AA"/>
    <circle cx="1520" cy="860" r="13" stroke="#9900AA"/>
  </g>
  <!-- Interchange: the Judge handoff -->
  <circle cx="1120" cy="750" r="34" fill="#FFFFFF" stroke="#1B2430" stroke-width="10"/>

  <!-- Text block, inside the 120 px safe margin -->
  <g fill="#1B2430" font-family="Barlow Condensed, Arial Narrow, sans-serif">
    <text x="160" y="300" font-size="170" font-weight="600" letter-spacing="2">FairTrip</text>
    <text x="160" y="410" font-size="52">Ryde — Multi-Agent Autonomous Dispute Resolution System</text>
    <text x="160" y="490" font-size="44" fill="#5B6770" font-family="system-ui, sans-serif">Three agents resolve ride disputes with transparent evidence.</text>
    <text x="160" y="940" font-size="30" fill="#5B6770" font-family="system-ui, sans-serif">Prototype · synthetic data · demonstration policy</text>
  </g>
</svg>
